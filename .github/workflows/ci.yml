
name: C++ CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build program
        run: make

      - name: Build tests
        run: make test.exe

      - name: Save executables
        uses: actions/upload-artifact@v4
        with:
          name: compiled-programs
          path: |
            program.exe
            test.exe

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          name: compiled-programs

      - name: Make executables runnable
        run: chmod +x program.exe test.exe

      - name: Test test.exe
        run: ./test.exe

      - name: Test program.exe
        run: |
          output=$(./program.exe)
          echo "$output"
          test "$output" = "OK"

