
name: C++ CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile program and tests
        run: make

      - name: Save executables
        uses: actions/upload-artifact@v4
        with:
          name: compiled-programs
          path: |
            program.exe
            test.exe

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          name: compiled-programs

      - name: Run unit tests
        run: ./test.exe

      - name: Run program
        run: |
          output=$(./program.exe)
          echo "$output"
          test "$output" = "Wynik: 5"

